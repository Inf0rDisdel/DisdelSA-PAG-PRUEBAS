    <!-- 1. PRECONNECTS Y DNS-PREFETCH -->
    <link rel="preconnect" href="https://www.disdelsagt.com" crossorigin />

    <link rel="dns-prefetch" href="https://disdelsa.com" />
    <link rel="dns-prefetch" href="https://www.disdelsagt.com" />

    <!-- Inicia temprano la consulta que alimenta el Hero y el Header. React
         reutiliza esta promesa para no repetir la petición. -->
    <script>
      var earlyBannerRequest = typeof window.fetch === 'function'
        ? window.fetch(
            'https://www.disdelsagt.com/MyWsMobil/api/PaginaWeb/GetBanners',
            {
              method: 'POST',
              headers: {
                'Accept': 'application/json',
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ IdCompania: 1007, Division: '1' })
            }
          )
        : Promise.resolve(null);

      window.__DISDEL_BANNERS_PROMISE__ = earlyBannerRequest
        .then(function (response) {
          if (!response) return null;
          if (!response.ok) throw new Error('No fue posible precargar los banners');
          return response.json();
        })
        .then(function (data) {
          if (!Array.isArray(data)) return null;

          var firstHero = data.find(function (banner) {
            return String(banner.IdTipoBanner) === '3';
          });
          var heroPath = firstHero && (firstHero.Imagen || firstHero.BannerImagenMovil);
          var invalidPath = !heroPath || /^(?:0|undefined|null|n\/a)$/i.test(String(heroPath).trim());

          // La URL procede siempre de la API: no se liga el sitio a un banner
          // específico. La precarga usa exactamente las variantes WebP que
          // renderiza OptimizedImage, evitando descargar también el original.
          if (!invalidPath) {
            var cleanHeroPath = String(heroPath).replace(/^\/+/, '');
            var heroSizes = window.matchMedia('(max-width: 480px)').matches
              ? 'calc(100vw - 20px)'
              : '(min-width: 1400px) 620px, 45vw';
            var heroWidths = window.matchMedia('(max-width: 480px)').matches
              ? [360, 480, 640]
              : [480, 640, 800, 960];
            var optimizedUrl = function (width) {
              return '/image-optimizer.php?src=' + encodeURIComponent(cleanHeroPath) +
                '&w=' + width + '&q=76';
            };
            var heroPreload = document.createElement('link');
            heroPreload.rel = 'preload';
            heroPreload.as = 'image';
            heroPreload.type = 'image/webp';
            heroPreload.fetchPriority = 'high';
            heroPreload.imageSrcset = heroWidths.map(function (width) {
              return optimizedUrl(width) + ' ' + width + 'w';
            }).join(', ');
            heroPreload.imageSizes = heroSizes;
            heroPreload.href = optimizedUrl(window.matchMedia('(max-width: 480px)').matches ? 640 : 800);
            document.head.appendChild(heroPreload);
            window.__DISDEL_HERO_PRELOAD__ = heroPreload;
          }

          return data;
        })
        .catch(function () { return null; });
    </script>
